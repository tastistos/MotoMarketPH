    <!-- Voiceflow AI Webchat Integration (Project ID: 6a954fda9c3c19ad3d86a17a) -->
    <script type="text/javascript">
      (function(d, t) {
          var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
          v.onload = function() {
            if (window.voiceflow && window.voiceflow.chat) {
              window.voiceflow.chat.load({
                verify: { projectID: '6a954fda9c3c19ad3d86a17a' },
                url: 'https://general-runtime.voiceflow.com',
                versionID: 'production',
                autostart: true,
                launch: {
                  event: { type: 'launch' }
                },
                assistant: {
                  title: "MotoStreet AI Mechanic",
                  description: "Motorcycle Parts & Tuning Specialist",
                  color: "#DC2626"
                }
              }).then(function() {
                setTimeout(function() {
                  try {
                    if (window.voiceflow && window.voiceflow.chat) {
                      window.voiceflow.chat.open();
                      if (typeof window.voiceflow.chat.start === 'function') {
                        window.voiceflow.chat.start();
                      }
                    }
                  } catch (e) {
                    console.log('Voiceflow ready');
                  }
                }, 500);
              }).catch(function(err) {
                console.warn('Voiceflow load info:', err);
              });
            }
          };
          v.src = "https://cdn.voiceflow.com/widget/bundle.mjs"; 
          v.type = "text/javascript"; 
          s.parentNode.insertBefore(v, s);
      })(document, 'script');
    </script>
